<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Category</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        /* =========================
           Main Product Section
        ========================= */

        .product-section {
            max-width: 1200px;
            margin: auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           Category Navigation
        ========================= */

        .category-nav {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 15px 20px;

            border-bottom: 1px solid #eeeeee;

            overflow-x: auto;
        }

        .category-nav::-webkit-scrollbar {
            height: 4px;
        }

        .category-nav::-webkit-scrollbar-thumb {
            background: #cccccc;
            border-radius: 10px;
        }


        .category-btn {
            border: none;
            background: transparent;

            padding: 10px 18px;

            border-radius: 6px;

            font-size: 15px;
            font-weight: 600;

            color: #555;

            cursor: pointer;

            white-space: nowrap;

            transition: 0.3s;
        }

        .category-btn:hover {
            background: #eef4ff;
            color: #0d6efd;
        }

        .category-btn.active {
            background: #0d6efd;
            color: #ffffff;
        }


        /* =========================
           Product Container
        ========================= */

        .product-container {
            padding: 25px;
        }


        .category-title {
            margin: 0 0 20px 0;

            font-size: 24px;
            font-weight: 700;

            color: #222;
        }


        /* =========================
           Product Grid
        ========================= */

        .product-grid {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;
        }


        /* =========================
           Product Card
        ========================= */

        .product-card {
            background: #ffffff;

            border: 1px solid #eeeeee;

            border-radius: 10px;

            overflow: hidden;

            transition: 0.3s;

            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.12);
        }


        .product-image {
            width: 100%;
            height: 200px;

            object-fit: cover;

            display: block;
        }


        .product-info {
            padding: 15px;
        }


        .product-name {
            margin: 0 0 8px;

            font-size: 18px;
            font-weight: 600;

            color: #222;
        }


        .product-description {
            margin: 0 0 12px;

            font-size: 14px;

            color: #777;

            line-height: 1.5;
        }


        .product-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .product-price {
            font-size: 18px;

            font-weight: 700;

            color: #0d6efd;
        }


        .view-btn {
            border: none;

            background: #0d6efd;

            color: white;

            padding: 7px 12px;

            border-radius: 5px;

            cursor: pointer;
        }

        .view-btn:hover {
            background: #0b5ed7;
        }


        /* =========================
           No Product
        ========================= */

        .no-product {
            text-align: center;

            padding: 50px 20px;

            color: #777;

            font-size: 17px;
        }


        /* =========================
           Tablet
        ========================= */

        @media (max-width: 992px) {

            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        /* =========================
           Mobile
        ========================= */

        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .product-container {
                padding: 15px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .product-image {
                height: 160px;
            }

        }


        @media (max-width: 480px) {

            .product-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 220px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         PRODUCT SECTION
    ====================================== -->

    <div class="product-section">


        <!-- Category Navigation -->

        <div class="category-nav" id="categoryNav">

            <!-- JavaScript will create categories here -->

        </div>


        <!-- Product Area -->

        <div class="product-container">

            <h2 class="category-title" id="categoryTitle">
                All Products
            </h2>


            <div class="product-grid" id="productGrid">

                <!-- JavaScript will create products here -->

            </div>

        </div>

    </div>

    <script src="assets/js/main.js"></script>

    
    
      <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
